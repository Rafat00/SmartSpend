<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Database unavailable · SmartSpend</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
</head>
<body class="bg-light">
  {# Standalone page on purpose: the normal layout asks the database who is logged in,
     which would fail again while the database is down. #}
  <div class="container text-center py-5">
    <i class="bi bi-database-x text-danger" style="font-size:4rem"></i>
    <h1 class="h3 mt-3">We can't reach the database right now</h1>
    <p class="text-muted">Please make sure PostgreSQL is running and the DATABASE_URL in your .env file is correct, then try again.</p>
    <a class="btn btn-primary" href="javascript:location.reload()">Try again</a>
  </div>
</body>
</html>
