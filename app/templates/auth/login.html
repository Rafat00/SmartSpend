{% extends 'base.html' %}
{% block title %}Log in{% endblock %}
{% block auth_content %}
<div class="card shadow border-0">
  <div class="card-body p-4">
    <div class="text-center mb-4">
      <i class="bi bi-wallet2 text-primary" style="font-size:2.5rem"></i>
      <h1 class="h3 fw-bold mt-2">SmartSpend</h1>
      <p class="text-muted mb-0">AI-powered personal expense tracker</p>
    </div>
    <form method="post" novalidate>
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <div class="mb-3">
        <label class="form-label" for="email">Email</label>
        <input class="form-control" type="email" id="email" name="email" value="{{ email }}" required autofocus>
      </div>
      <div class="mb-3">
        <label class="form-label" for="password">Password</label>
        <input class="form-control" type="password" id="password" name="password" required>
      </div>
      <div class="form-check mb-3">
        <input class="form-check-input" type="checkbox" id="remember" name="remember">
        <label class="form-check-label" for="remember">Remember me</label>
      </div>
      <button class="btn btn-primary w-100">Log in</button>
    </form>
    <p class="text-center mt-3 mb-0">New here? <a href="{{ url_for('auth.register') }}">Create an account</a></p>
  </div>
</div>
{% endblock %}
