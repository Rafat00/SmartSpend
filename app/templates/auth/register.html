{% extends 'base.html' %}
{% block title %}Register{% endblock %}
{% block auth_content %}
<div class="card shadow border-0">
  <div class="card-body p-4">
    <div class="text-center mb-4">
      <i class="bi bi-wallet2 text-primary" style="font-size:2.5rem"></i>
      <h1 class="h3 fw-bold mt-2">Create your account</h1>
    </div>
    <form method="post" novalidate>
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <div class="mb-3">
        <label class="form-label" for="name">Full name</label>
        <input class="form-control" id="name" name="name" value="{{ form.name }}" maxlength="100" required autofocus>
      </div>
      <div class="mb-3">
        <label class="form-label" for="email">Email</label>
        <input class="form-control" type="email" id="email" name="email" value="{{ form.email }}" required>
      </div>
      <div class="mb-3">
        <label class="form-label" for="password">Password</label>
        <input class="form-control" type="password" id="password" name="password" minlength="8" required>
        <div class="form-text">At least 8 characters, with a letter and a number.</div>
      </div>
      <div class="mb-3">
        <label class="form-label" for="confirm_password">Confirm password</label>
        <input class="form-control" type="password" id="confirm_password" name="confirm_password" required>
      </div>
      <button class="btn btn-primary w-100">Register</button>
    </form>
    <p class="text-center mt-3 mb-0">Already have an account? <a href="{{ url_for('auth.login') }}">Log in</a></p>
  </div>
</div>
{% endblock %}
